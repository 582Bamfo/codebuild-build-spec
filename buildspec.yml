# Build specification for CodeBuild to build and push Docker image to ECR
version: 0.2

env:
  variables:
    REPOSITORY_URI: 449325664824.dkr.ecr.eu-west-1.amazonaws.com/dev
    CONTAINER_NAME: grafana

phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - echo "Using Docker version"
      - docker --version

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version

      - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 449325664824.dkr.ecr.eu-west-1.amazonaws.com

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi

      - echo "Image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."

      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .

  post_build:
    commands:
      - echo "Build completed on $(date)"

      - echo "Pushing Docker images..."

      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - docker push $REPOSITORY_URI:latest

      - echo "Generating imagedefinitions.json..."

      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json